<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" fill="#000"/>
  <!-- flap: thrown open behind the card, shallow -->
  <path d="M24 50 L50 32 L76 50"
        stroke="rgba(255,255,255,0.45)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the invitation, half drawn out -->
  <g>
    <path d="M34 22 L66 22 L66 56 L34 56 Z" fill="#000"
          stroke="rgba(255,255,255,0.85)" stroke-width="2"/>
    <!-- a line of the letter showing -->
    <path d="M40 32 L60 32 M40 39 L54 39"
          stroke="rgba(255,255,255,0.35)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <!-- envelope front: covers the card's lower half -->
  <g>
    <path d="M22 50 L78 50 L78 82 L22 82 Z" fill="#000"
          stroke="rgba(255,255,255,0.85)" stroke-width="2.4" stroke-linejoin="round"/>
  </g>
</svg>
