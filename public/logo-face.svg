<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#000"/>
  <g fill="#ededed">
    <!-- face: one filled angular slab - brow to square jaw -->
    <path d="M30 24 L70 24 L72 40 L71 58 L64 72 L54 78 L46 78 L36 72 L29 58 L28 40 Z"/>
    <!-- hair: heavy crop sitting on the brow -->
    <path d="M28 26 C30 14 44 10 50 10 C56 10 70 14 72 26 L72 32 L66 32 L64 24 L36 24 L34 32 L28 32 Z"/>
    <!-- neck + shoulders -->
    <path d="M40 76 L44 82 L56 82 L60 76 L62 84 L74 88 L74 100 L26 100 L26 88 L38 84 Z"/>
  </g>
  <g fill="#000">
    <!-- brow shelf: low at the glabella, high outside - determined, not worried -->
    <path d="M33 36 L47 40 L47 43 L33 39 Z"/>
    <path d="M53 40 L67 36 L67 39 L53 43 Z"/>
    <!-- eyes: level slits under the shelf -->
    <rect x="36" y="45.5" width="10" height="2.6"/>
    <rect x="54" y="45.5" width="10" height="2.6"/>
    <!-- nose: straight wedge -->
    <path d="M48 42 L52 42 L54 58 L46 58 Z M46 58 L54 58 L52 61 L48 61 Z" fill-rule="evenodd"/>
    <!-- mouth: flat and done with your questions -->
    <rect x="42" y="66" width="16" height="2.6"/>
  </g>
</svg>
